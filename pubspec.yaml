name: api_tester
description: "A powerful HTTP API testing tool."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.4.3+1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^4.4.0
  google_fonts: ^6.2.1
  supabase_flutter: ^2.8.4
  connectivity_plus: ^6.1.3
  file_picker: ^8.1.7
  yaml: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
